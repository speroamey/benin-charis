name: 🚀 Deploy Laravel (Prod & Preprod)

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    name: 🔧 Deployment
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupération du code
      - name: 🧱 Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configuration SSH pour deploy
      - name: 🔑 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Fichier config pour host mowondoo
          echo "Host mowondoo
            HostName panel.mowondoo.com
            User deploy
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no" > ~/.ssh/config

      # 3️⃣ Node.js
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 4️⃣ Dépendances JS
      - name: 📦 Install NPM dependencies
        run: npm ci

      # 5️⃣ Build frontend
      # - name: 🏗️ Build frontend assets
      #   run: npm run build

      # 6️⃣ Définition de l’environnement selon la branche
      - name: 🧠 Define deployment target
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "DEPLOY_PATH=/var/www/benincharis.org/web" >> $GITHUB_ENV
            echo "ENV_NAME=production" >> $GITHUB_ENV
          elif [ "${GITHUB_REF_NAME}" = "dev" ]; then
            echo "DEPLOY_PATH=/var/www/dev.benincharis.org/web" >> $GITHUB_ENV
            echo "ENV_NAME=staging" >> $GITHUB_ENV
          fi

      # 7️⃣ Synchronisation des fichiers via deploy
      - name: 📤 Deploy code via rsync
        run: |
          rsync -rz --delete \
            --no-perms \
            --no-owner \
            --no-group \
            --omit-dir-times \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "node_modules/" \
            --exclude "vendor/" \
            --exclude ".env" \
            ./ mowondoo:${{ env.DEPLOY_PATH }}

      - name: 🔁 Fix ownership
        run: |
          ssh mowondoo "
            chown -R web25:client4 $DEPLOY_PATH
          "

      # 8️⃣ Commandes Laravel côté serveur
      - name: ⚙️ Run Laravel deployment commands
        run: |
          ssh mowondoo << EOF
            cd $DEPLOY_PATH

            echo "📦 Installation des dépendances PHP..."
            COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader

            # Création .env si absent (staging seulement)
            if [ "$ENV_NAME" = "staging" ]; then
              if [ ! -f .env ]; then
                echo "📄 Création du fichier .env..."
                cp .env.example .env
                php artisan key:generate --force
              fi
            fi

            echo "🗄️ Exécution des migrations..."
            php artisan migrate --force

            echo "⚡ Optimisation Laravel..."
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            php artisan optimize

            echo "🧹 Permissions..."
            chmod -R 775 storage bootstrap/cache

            echo "✅ Déploiement terminé pour $ENV_NAME"
          EOF
